name: portfolio
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  animated_text_kit: ^4.2.2
  particles_flutter: ^0.1.4
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.0
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
    - assets/svg/

  fonts:
    - family: Medieval
      fonts:
        - asset: assets/fonts/medieval.ttf
    - family: PixelArt
      fonts:
        - asset: assets/fonts/pixel.ttf